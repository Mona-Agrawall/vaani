server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        # uploads go up to 500 MB and are streamed straight to the backend
        client_max_body_size 500m;
        proxy_request_buffering off;
        # each pipeline step is one request, and transcription or separation can take minutes
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
